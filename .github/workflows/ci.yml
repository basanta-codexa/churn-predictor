name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q app.py src tests scripts

      - name: Run the test suite
        run: python -m pytest tests -q

  reproduce:
    name: Retrain and verify metrics
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Retrain from the committed data
        run: python src/train.py

      - name: Compare retrained metrics with the committed artifacts
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          # train.py just overwrote metadata.json in place, so the committed
          # metrics have to be read back from git.
          retrained = json.loads(
              (Path("models") / "metadata.json").read_text())
          committed = json.loads(subprocess.run(
              ["git", "show", "HEAD:models/metadata.json"],
              capture_output=True, text=True, check=True).stdout)

          a = committed["metrics"]["test"]
          b = retrained["metrics"]["test"]
          tolerances = {
              "roc_auc": 0.01,
              "pr_auc": 0.01,
              "precision": 0.02,
              "recall": 0.02,
              "f1": 0.02,
              "brier": 0.01,
          }
          for key, tol in tolerances.items():
              delta = abs(a[key] - b[key])
              print(f"{key:10s} committed={a[key]:.4f} "
                    f"retrained={b[key]:.4f} delta={delta:.4f}")
              assert delta <= tol, f"{key} drifted by {delta:.4f} > {tol}"
          print("retrain reproducibility check passed")
          PY
