[theme]
base = "dark"
primaryColor = "#7C8CFF"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#14171F"
textColor = "#E6E8EE"
linkColor = "#9AA5FF"
borderColor = "#242936"
font = "sans serif"

baseFontSize = 15
baseFontWeight = 400
baseRadius = "12px"
buttonRadius = "8px"

headingFontSizes = ["1.75rem", "1.25rem", "1.1rem", "1rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

metricValueFontSize = "1.75rem"
metricValueFontWeight = 700

showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#7C8CFF", "#4ADE80", "#FBBF24", "#F87171", "#B98CFF", "#94A3B8"]

[theme.sidebar]
backgroundColor = "#0E1016"
secondaryBackgroundColor = "#14171F"
textColor = "#C3C8D4"
primaryColor = "#7C8CFF"
borderColor = "#242936"
baseRadius = "8px"
showWidgetBorder = true
