[theme]
base = "light"
primaryColor = "#356AE6"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
linkColor = "#356AE6"
borderColor = "#E6EAF0"
font = "sans serif"

baseFontSize = 15
baseFontWeight = 400
baseRadius = "12px"
buttonRadius = "8px"

headingFontSizes = ["1.9rem", "1.3rem", "1.1rem", "1rem", "0.9rem", "0.85rem"]
headingFontWeights = [750, 700, 650, 600, 600, 600]

metricValueFontSize = "1.9rem"
metricValueFontWeight = 750

showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#356AE6", "#269B78", "#D99A32", "#D9534F", "#7C3AED", "#667085"]

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2B"
textColor = "#CBD5E1"
primaryColor = "#93C5FD"
borderColor = "#1E293B"
baseRadius = "8px"
showWidgetBorder = true
