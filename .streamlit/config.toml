[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
linkColor = "#1D4ED8"
borderColor = "#E2E5EA"
font = "sans serif"

baseFontSize = 15
baseFontWeight = 400
baseRadius = "10px"
buttonRadius = "8px"

headingFontSizes = ["1.75rem", "1.25rem", "1.1rem", "1rem", "0.9rem", "0.85rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]

metricValueFontSize = "1.75rem"
metricValueFontWeight = 700

showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#1D4ED8", "#0F766E", "#B45309", "#B91C1C", "#6D28D9", "#475569"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#374151"
primaryColor = "#1D4ED8"
borderColor = "#E2E5EA"
baseRadius = "8px"
showWidgetBorder = true
